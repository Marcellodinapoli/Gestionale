# Netlify — Credixa (Next.js)
#
# Obbligatorio in Site settings → Environment variables:
#   OPERATIONAL_BACKEND=firebase          # finché i dati operativi restano su Firestore
#   SESSION_SECRET=stringa lunga casuale
#   FIREBASE_SERVICE_ACCOUNT_JSON=<contenuto intero serviceAccountKey.json>
#   NEXT_PUBLIC_FIREBASE_API_KEY=...
#   NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=creditform-d505d.firebaseapp.com
#   NEXT_PUBLIC_FIREBASE_PROJECT_ID=creditform-d505d
#   NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=...
#   NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=...
#   NEXT_PUBLIC_FIREBASE_APP_ID=...
#
# Neon (Postgres cloud) — quando collegato:
#   NEON_DATABASE_URL=postgresql://…@….neon.tech/neondb?sslmode=require
# Formazione resta su Firebase anche con Neon attivo.
# Non impostare DATABASE_URL Prisma su Neon (resta file tipi / sqlite locale).
# SQL Server on-premise: non richiesto su Netlify (solo Connettore in LAN).

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22.12.0"
  OPERATIONAL_BACKEND = "firebase"

# firebase-admin + jwks-rsa: non bundlare (jose ESM)
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "jwks-rsa", "jose", "@google-cloud/firestore", "google-gax", "google-auth-library", "@neondatabase/serverless"]

[[plugins]]
  package = "@netlify/plugin-nextjs"
